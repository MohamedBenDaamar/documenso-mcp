name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bundles the server and the signing-status View, which typecheck and tests do not exercise.
      # The build loads index.ts, which validates the config; the URL is read again at startup, not bundled.
      - run: npm run build
        env:
          DOCUMENSO_URL: https://documenso.invalid
